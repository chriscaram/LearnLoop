name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build web
        run: npm run build -w web

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: cdk deploy
        working-directory: infra
        env:
          SES_SENDER: ${{ vars.SES_SENDER }}
          EMAIL_RECIPIENT_OVERRIDE: ${{ vars.EMAIL_RECIPIENT_OVERRIDE }}
        run: |
          APP_VERSION="$(git rev-parse --short=7 HEAD)"
          npx cdk deploy LearnLoopProd \
            --require-approval never \
            -c appVersion="$APP_VERSION" \
            --parameters sesSender="$SES_SENDER" \
            --parameters emailRecipientOverride="$EMAIL_RECIPIENT_OVERRIDE" \
            --outputs-file ../cdk-outputs.json

      - name: Upload web assets
        run: |
          WEB_BUCKET="$(jq -r '.LearnLoopProd.WebBucketName' cdk-outputs.json)"
          aws s3 sync web/dist/assets "s3://$WEB_BUCKET/assets" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync web/dist "s3://$WEB_BUCKET" --exclude "assets/*" --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          DISTRIBUTION_ID="$(jq -r '.LearnLoopProd.DistributionId' cdk-outputs.json)"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
