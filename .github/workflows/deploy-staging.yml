name: Deploy staging

# Deploys a ref (by default the `staging` branch) to LearnLoopStaging, an
# independent copy of the app with its own URL, buckets, secrets, flags and
# state. After the deploy it switches on every ga-* flag the deployed code
# reads and, unless told not to, runs every scheduled job the deployed
# functions register once. The result goes to the run summary.

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to deploy to staging
        required: false
        type: string
        default: staging
      run_jobs:
        description: Run every scheduled job once after deploying
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS

# Staging has its own queue: it never waits for, or displaces, a prod deploy.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Pin the commit so the deploy and the follow-up steps use the same code even if the branch moves.
      - name: Resolve the commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    uses: ./.github/workflows/_deploy.yml
    with:
      ref: ${{ needs.test.outputs.sha }}
      environment: preview # OIDC subject repo:<repo>:environment:preview
      stack: LearnLoopStaging

  activate:
    needs: [test, deploy]
    runs-on: ubuntu-latest
    environment: preview # OIDC subject repo:<repo>:environment:preview
    env:
      AWS_REGION: us-east-1
      LEARNLOOP_STACK: LearnLoopStaging # read by npm run flag / notifications:since
      FUNCTION_PREFIX: learnloop-staging
      SHA: ${{ needs.test.outputs.sha }}
      APP_URL: ${{ needs.deploy.outputs.url }}
      APP_VERSION: ${{ needs.deploy.outputs.version }}
      RUN_JOBS: ${{ github.event_name == 'push' || inputs.run_jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Switch on the flags the deployed code reads
        run: |
          set -euo pipefail
          node tools/ops/src/list-flags.js . | tee flags.json
          for key in $(jq -r '.[]' flags.json); do
            [[ "$key" =~ ^ga-[a-z0-9_-]{1,61}$ ]] || { echo "::error::'$key' is not a valid flag key"; exit 1; }
            npm run -s flag -- "$key" on
          done

      - name: Run the scheduled jobs once
        if: env.RUN_JOBS == 'true'
        env:
          AWS_MAX_ATTEMPTS: '1' # never retry: each job runs exactly once
        run: |
          set -euo pipefail
          echo '[]' > results.json
          # Start of the job window (5 s early for clock skew): notifications created after it are the jobs' effect.
          date -u -d '-5 seconds' +%Y-%m-%dT%H:%M:%S.000Z > since.txt
          for dir in services/*/; do
            svc="$(basename "$dir")"
            [[ -f "$dir/src/handler.js" ]] || continue
            fn="$FUNCTION_PREFIX-$svc"
            aws lambda invoke --function-name "$fn" --cli-binary-format raw-in-base64-out \
              --payload '{"listJobs":true}' "list-$svc.json" > /dev/null
            for job in $(jq -r '.jobs // [] | .[]' "list-$svc.json"); do
              payload="$(jq -cn --arg j "$job" '{job: $j}')"
              echo "invoking $fn with $payload"
              entry="$(jq -cn --arg s "$svc" --arg j "$job" '{service: $s, job: $j}')"
              if aws lambda invoke --function-name "$fn" --cli-binary-format raw-in-base64-out \
                   --cli-read-timeout 180 --payload "$payload" out.json > meta.json 2> err.txt; then
                jq --argjson e "$entry" --slurpfile meta meta.json --rawfile out out.json \
                  '. + [$e + {statusCode: $meta[0].StatusCode, functionError: ($meta[0].FunctionError // null), response: ($out | .[0:500])}]' results.json > tmp.json
              else
                jq --argjson e "$entry" --rawfile err err.txt \
                  '. + [$e + {statusCode: null, functionError: "InvokeFailed", response: ($err | .[0:500])}]' results.json > tmp.json
              fi
              mv tmp.json results.json
            done
          done
          cat results.json
          node tools/ops/src/new-notifications.js "$(cat since.txt)" --json \
            | jq '{total: length, learners: (map(.name) | unique | length)}' > notifications.json
          cat notifications.json

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Staging deployed"
            echo
            echo "- **App:** $APP_URL"
            echo "- **Commit:** \`${SHA:0:7}\` (\`$APP_VERSION\`)"
            if [[ -s flags.json && "$(jq length flags.json)" != 0 ]]; then
              echo "- **Flags switched on:** $(jq -r 'map("`\(.)`") | join(", ")' flags.json)"
            else
              echo "- **Flags switched on:** none (the code reads no ga-* flag)"
            fi
            echo
            if [[ "$RUN_JOBS" != true ]]; then
              echo "Scheduled jobs were not run."
            elif [[ ! -s results.json || "$(jq length results.json)" == 0 ]]; then
              echo "No scheduled jobs ran."
            else
              echo "**Scheduled jobs, run once:**"
              echo
              echo "| Function | Job | Status | Function error | Response |"
              echo "|---|---|---|---|---|"
              jq -r --arg p "$FUNCTION_PREFIX" '.[] | "| \($p)-\(.service) | `\(.job)` | \(.statusCode // "–") | \(.functionError // "none") | `\(.response | gsub("[\\n|`]"; " "))` |"' results.json
              if [[ -s notifications.json ]]; then
                echo
                echo "$(jq .total notifications.json) notification(s) created for $(jq .learners notifications.json) learner(s)."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if a job failed
        if: env.RUN_JOBS == 'true'
        run: |
          set -euo pipefail
          failed="$(jq '[.[] | select(.functionError != null)] | length' results.json)"
          [[ "$failed" == 0 ]] || { echo "::error::$failed scheduled job(s) failed on staging"; exit 1; }
