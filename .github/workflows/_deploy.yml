name: Deploy (reusable)

# Deploys a ref to a LearnLoop stack (LearnLoopProd unless `stack` says
# otherwise). Called by deploy.yml (main), preview.yml (a verified ga/* branch)
# and preview-reset.yml (back to main), all on LearnLoopProd, and by
# deploy-staging.yml on LearnLoopStaging.
# Callers own the concurrency group (`deploy-prod`, `deploy-staging`): declaring
# it here as well would make the called workflow wait for its own caller.

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit SHA to deploy
        required: true
        type: string
      environment:
        description: GitHub environment of the deploy job (prod or preview; part of the OIDC subject)
        required: true
        type: string
      stack:
        description: Stack to deploy (LearnLoopProd or LearnLoopStaging)
        required: false
        type: string
        default: LearnLoopProd
    outputs:
      url:
        description: CloudFront URL of the app
        value: ${{ jobs.deploy.outputs.url }}
      version:
        description: Short SHA that was deployed (APP_VERSION)
        value: ${{ jobs.deploy.outputs.version }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.outputs.outputs.url }}
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS
    env:
      AWS_REGION: us-east-1
      STACK: ${{ inputs.stack }}
    outputs:
      url: ${{ steps.outputs.outputs.url }}
      version: ${{ steps.outputs.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web
        run: npm run build -w web

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: cdk deploy
        working-directory: infra
        env:
          SES_SENDER: ${{ vars.SES_SENDER }}
          EMAIL_RECIPIENT_OVERRIDE: ${{ vars.EMAIL_RECIPIENT_OVERRIDE }}
        run: |
          [[ "$STACK" =~ ^LearnLoop(Prod|Staging)$ ]] || { echo "::error::unknown stack '$STACK'"; exit 1; }
          APP_VERSION="$(git rev-parse --short=7 HEAD)"
          npx cdk deploy "$STACK" \
            --require-approval never \
            -c appVersion="$APP_VERSION" \
            --parameters sesSender="$SES_SENDER" \
            --parameters emailRecipientOverride="$EMAIL_RECIPIENT_OVERRIDE" \
            --outputs-file ../cdk-outputs.json

      - name: Stack outputs
        id: outputs
        run: |
          echo "url=https://$(jq -r --arg s "$STACK" '.[$s].DistributionDomainName' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload web assets
        run: |
          WEB_BUCKET="$(jq -r --arg s "$STACK" '.[$s].WebBucketName' cdk-outputs.json)"
          aws s3 sync web/dist/assets "s3://$WEB_BUCKET/assets" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync web/dist "s3://$WEB_BUCKET" --exclude "assets/*" --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          DISTRIBUTION_ID="$(jq -r --arg s "$STACK" '.[$s].DistributionId' cdk-outputs.json)"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
